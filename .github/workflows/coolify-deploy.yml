# The deploy every Thought Fox site shares. A site's own deploy.yml calls this
# one and passes its application ID and address (see "Deploying a site" in
# the README), so a fix made here reaches every site at its next toolkit bump.
#
# What it does: Coolify sits behind Tailscale, so GitHub can't reach its
# webhook. The runner joins the tailnet as a short-lived node and calls the
# deploy API over it. Coolify stays private; nothing of it is published.
#
# The run then waits for Coolify to finish the build and for the site to
# answer, so a green run means the site is deployed and a red one means it is
# not. It used to post the request and stop there, which reported success
# whatever Coolify did next: on 5 November 2026 a Root build died of memory
# exhaustion while the run stayed green and nothing said so.
#
# First written for Root (wearethoughtfox/root), then copied to We Are
# Thought Fox, where it was proven a second time on 16 November 2026.
name: Coolify deploy

on:
  workflow_call:
    inputs:
      app_uuid:
        description: The Coolify application's UUID (in its URL in Coolify). Not a credential.
        required: true
        type: string
      site_url:
        description: The address the application serves, checked after the build.
        required: true
        type: string
      build_timeout_minutes:
        description: How long to wait for the build. Root's image processing needs about 25.
        required: false
        type: number
        default: 15
      coolify_host:
        description: Coolify's tailnet address. Only reachable from the tailnet.
        required: false
        type: string
        default: 100.116.49.103
      coolify_port:
        required: false
        type: number
        default: 8000
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      COOLIFY_TOKEN:
        description: A Coolify API token with read as well as deploy.
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest

    # Inputs reach the shell as environment variables, never pasted into a
    # script, so a stray quote in one can't change what runs.
    env:
      COOLIFY_URL: http://${{ inputs.coolify_host }}:${{ inputs.coolify_port }}
      APP_UUID: ${{ inputs.app_uuid }}
      SITE_URL: ${{ inputs.site_url }}
      BUILD_TIMEOUT_MINUTES: ${{ inputs.build_timeout_minutes }}

    steps:
      # A new site's deploy.yml starts with both values empty. This fails
      # with a plain message until they are filled in, rather than as a
      # confusing curl error further down.
      - name: Check the workflow is configured
        run: |
          if [ -z "$APP_UUID" ] || [ -z "$SITE_URL" ]; then
            echo "::error::app_uuid and site_url are empty in this site's .github/workflows/deploy.yml. Create the application in Coolify, then fill both in."
            exit 1
          fi

      # Joins the tailnet as an ephemeral node, removed when the job ends.
      # `ping` waits for the host to answer before the next step, so a slow
      # tailnet start fails here with a clear message.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ inputs.coolify_host }}

      # A 200 here means Coolify accepted the request, nothing more. The
      # response may wrap its deployment in a `deployments` array or return a
      # flat `deployment_uuid`, so this reads both shapes.
      - name: Start the deploy
        id: start
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false")
          echo "$response"
          deployment=$(echo "$response" | jq -r \
            '(.deployments[0].deployment_uuid // .deployment_uuid) // empty')
          if [ -z "$deployment" ]; then
            echo "::error::Coolify accepted the request but returned no deployment UUID, so this run cannot tell whether the build succeeds. Check Coolify."
            exit 1
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      # Coolify's status values are not listed in its API docs, so only
      # `finished` is treated as success and only `failed` and `cancelled…`
      # as failure. Anything else is taken as still running, so an unknown
      # status never reads as a successful deploy.
      - name: Wait for the build
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT: ${{ steps.start.outputs.deployment }}
        run: |
          # One check every 15 seconds.
          attempts=$(( BUILD_TIMEOUT_MINUTES * 4 ))
          for attempt in $(seq 1 "$attempts"); do
            response=$(curl --silent --show-error --max-time 20 \
              --write-out '\n%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT")
            code=$(echo "$response" | tail -n1)
            case "$code" in
              401|403)
                echo "$response" | sed '$d'
                echo "::error::Coolify refused to report the deployment ($code). COOLIFY_TOKEN needs the read permission as well as deploy. Coolify → Keys & Tokens → API Tokens."
                exit 1 ;;
            esac
            status=$(echo "$response" | sed '$d' | jq -r '.status // empty')
            echo "$(date +%T) ${status:-no status (HTTP $code)}"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "::error::Coolify build $status. The build log is in Coolify under this application's deployments."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Build still not finished after $BUILD_TIMEOUT_MINUTES minutes"
          exit 1

      # A finished build can take a moment to start serving, and a container
      # that builds but won't boot would otherwise pass as a deploy.
      - name: Check the site answers
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$SITE_URL" || true)
            echo "$(date +%T) $code"
            case "$code" in 2*|3*) exit 0 ;; esac
            sleep 10
          done
          echo "::error::$SITE_URL didn't answer after the deploy (last status $code)"
          exit 1

      - name: Note the result
        run: echo "Deployed $GITHUB_SHA and $SITE_URL answered." >> "$GITHUB_STEP_SUMMARY"
